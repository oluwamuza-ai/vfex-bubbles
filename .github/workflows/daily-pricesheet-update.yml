name: Daily price sheet update

# Runs entirely on GitHub's infrastructure — doesn't need any local machine
# to be on. Two data sources, in priority order:
#   1. official-update.mjs — the ZSE/VFEX exchange operator's own public
#      API (undocumented, found via their site's JS bundles). Same-day,
#      more accurate than the PDF (has outstanding share counts, so market
#      cap is computed rather than trusted from a column), covers both
#      exchanges plus ETFs/REITs in one go. Allowed to fail without
#      stopping the job (continue-on-error) — if the API changes shape or
#      goes down, the next step below covers for it.
#   2. daily-update.mjs — wraps the older MMC Capital PDF pipeline
#      (mmc-update.js). Self-healing by design: it only writes when MMC's
#      newest sheet is dated later than what's already stored, so on a
#      normal day where step 1 already wrote today's date, this silently
#      no-ops — it only actually does anything on a day step 1 failed,
#      making it a true backup rather than a second write every day.
# Either way, this repo's hosting platform auto-deploys on push to main,
# so a successful run here is what actually updates the live site.
on:
  schedule:
    # ZSE's own posted trading hours (Pre-Open 09:00-09:30, Market Open
    # 09:30-13:00, Post-Close 13:00-14:30, Mon-Fri, Africa/Harare = UTC+2
    # year-round, no DST) put the close at 13:00 — this runs 10 minutes
    # after that, 13:10 Harare = 11:10 UTC. Note this is 10 min into the
    # post-close/settlement window, not 10 min after it ends at 14:30 — if
    # official-update.mjs starts turning up not-yet-final numbers, push
    # this later toward 14:40 UTC (16:40 Harare) instead.
    - cron: '10 11 * * 1-5'
  # Lets you (or Claude, if asked) trigger a run on demand from the
  # Actions tab instead of waiting for the schedule — useful for testing.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci (not install): installs exactly what's in package-lock.json
        # and fails instead of silently resolving newer versions — this
        # workflow has repo write access, so dependency drift here isn't
        # just a build-reproducibility concern.
        run: npm ci

      - name: Fetch today's data from the official exchange API (primary)
        run: node official-update.mjs
        continue-on-error: true

      - name: Fetch and parse MMC's price sheet PDF (backup, no-ops if already covered)
        run: node daily-update.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vfex-data.json vfex-history.json zse-data.json zse-history.json funds-data.json funds-history.json
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Daily price sheet update: $(date -u +%Y-%m-%d)"
            git push
          fi
